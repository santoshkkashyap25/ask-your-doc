[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-doc"
version = "2.0.0"
description = "Privacy-first, zero-retention RAG platform for querying PDF documents with exact citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Santosh Kumar Kashyap", email = "santoshkkashyap25@gmail.com" }
]
keywords = ["rag", "llm", "pdf", "privacy", "fastapi", "langgraph", "embeddings", "groq", "zero-retention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "pdfplumber>=0.10.3",
    "sentence-transformers>=2.5.0",
    "httpx>=0.27.0",
    "groq>=0.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "requests>=2.31.0"
]

[project.scripts]
ask-your-doc = "run:main"

[project.urls]
Homepage = "https://github.com/santoshkkashyap25/ask-your-doc"
Repository = "https://github.com/santoshkkashyap25/ask-your-doc.git"
Issues = "https://github.com/santoshkkashyap25/ask-your-doc/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "static*", "templates*"]

